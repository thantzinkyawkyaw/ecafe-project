<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Golden Spoon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Golden Spoon</a>
        </div>
    </header>

    <main class="login-page">
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <p class="section-label">SECURITY ALERT</p>
                    <h1>Change Password</h1>
                    <p>Please change your default password to continue.</p>
                </div>

                <div id="formMessage"></div>
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" placeholder="Enter current password" required>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    </div>

                    <button type="submit" class="login-btn">Update Password</button>
                </form>

                <p class="register-text" style="margin-top:20px;">
                    <a href="#" id="cancelChangeBtn" style="color:#64748b;">Cancel & Logout</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/change-password.js"></script>
</body>
</html>

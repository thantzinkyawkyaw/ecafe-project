<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Golden Spoon</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">
                Golden Spoon
            </a>

            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="about.html">About</a>
                <div id="authArea">
                    <a href="login.html">Login</a>
                </div>
            </nav>

        </div>

    </header>


    <!-- Login Section -->
    <main class="login-page">

        <div class="login-container">

            <div class="login-box">

                <div class="login-header">

                    <p class="section-label">
                        WELCOME BACK
                    </p>

                    <h1>
                        Login
                    </h1>

                    <p>
                        Login to your Golden Spoon account.
                    </p>

                </div>


                <!-- Login Form -->
                 <div id="formMessage"></div>
                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                name="remember"
                            >

                            Remember me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Login
                    </button>

                </form>


                <div class="login-divider">
                    <span>OR</span>
                </div>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Golden Spoon Restaurant.
                All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>

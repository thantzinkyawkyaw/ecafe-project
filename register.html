<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Golden Spoon</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- Header -->

    <header class="header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >
                Golden Spoon
            </a>


            <nav class="navbar">

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="about.html">
                    About
                </a>
                <a href="index.html#contact">
                    Contact
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </div>

    </header>


    <!-- Register -->

    <main class="login-page">

        <div class="login-container">

            <div class="login-box">

                <div class="login-header">

                    <p class="section-label">
                        JOIN US
                    </p>

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Create your Golden Spoon account.
                    </p>

                </div>

                <div id="formMessage"></div>
                <form id="registerForm">

    <div class="form-group">
        <label for="registerName">Full Name</label>
        <input
            type="text"
            id="registerName"
            placeholder="Enter your name"
        >
    </div>

    <div class="form-group">
        <label for="registerEmail">Email</label>
        <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
        >
    </div>

    <div class="form-group">
        <label for="registerPassword">Password</label>
        <input
            type="password"
            id="registerPassword"
            placeholder="Enter your password"
        >
    </div>

    <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
        >
    </div>

    <button type="submit" class="login-btn">
        Create Account
    </button>

</form>


                <div class="login-divider">

                    <span>OR</span>

                </div>


                <p class="register-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer class="footer">
        <div class="container">

            <p>
                © 2026 Golden Spoon Restaurant.
                All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
